[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slot-racing-platform"
version = "0.1.0"
description = "Modular desktop application for managing and running slot-racing tracks, drivers, vehicles, races and timing systems."
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "opencv-python-headless>=4.10",
    "pydantic>=2.6",
]

[project.gui-scripts]
slot-racing = "slot_racing.app.main:main"

[project.entry-points."slot_racing.plugins"]
drivers_vehicles = "slot_racing.modules.drivers_vehicles.plugin:DriversVehiclesPlugin"
tracks = "slot_racing.modules.tracks.plugin:TracksPlugin"
races = "slot_racing.modules.races.plugin:RacesPlugin"
timing = "slot_racing.modules.timing.plugin:TimingPlugin"
timing_camera = "slot_racing.modules.timing_camera.plugin:CameraTimingPlugin"
timing_sensor = "slot_racing.modules.timing_sensor.plugin:SensorTimingPlugin"
track_planner = "slot_racing.modules.track_planner.plugin:TrackPlannerPlugin"
audio_animation = "slot_racing.modules.audio_animation.plugin:AudioAnimationPlugin"
statistics = "slot_racing.modules.statistics.plugin:StatisticsPlugin"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slot_racing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not camera_hardware'"
markers = [
    "camera_hardware: opens a real camera; not part of the default or CI run",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/slot_racing/core/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011", "PT012", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Registries are keyed by abstract interface classes (e.g. TimingSource).
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["slot_racing"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core does not depend on app or modules"
type = "forbidden"
source_modules = ["slot_racing.core"]
forbidden_modules = ["slot_racing.app", "slot_racing.modules"]

[[tool.importlinter.contracts]]
name = "Core is free of UI and hardware libraries"
type = "forbidden"
source_modules = ["slot_racing.core"]
forbidden_modules = ["PySide6", "cv2", "gpiozero", "RPi"]

[[tool.importlinter.contracts]]
name = "Modules are independent of each other"
type = "independence"
modules = [
    "slot_racing.modules.drivers_vehicles",
    "slot_racing.modules.tracks",
    "slot_racing.modules.races",
    "slot_racing.modules.timing",
    "slot_racing.modules.timing_camera",
    "slot_racing.modules.timing_sensor",
    "slot_racing.modules.track_planner",
    "slot_racing.modules.audio_animation",
    "slot_racing.modules.statistics",
]

[[tool.importlinter.contracts]]
name = "Modules do not depend on the app shell"
type = "forbidden"
source_modules = ["slot_racing.modules"]
forbidden_modules = ["slot_racing.app"]

[[tool.importlinter.contracts]]
name = "App shell loads modules only through the plugin system"
type = "forbidden"
source_modules = ["slot_racing.app"]
forbidden_modules = ["slot_racing.modules"]

[[tool.importlinter.contracts]]
name = "Race logic is free of UI and hardware libraries"
type = "forbidden"
source_modules = [
    "slot_racing.modules.races.engine",
    "slot_racing.modules.races.service",
    "slot_racing.modules.races.recorder",
    "slot_racing.modules.races.runner",
    "slot_racing.modules.races.types",
    "slot_racing.modules.races.models",
]
forbidden_modules = ["PySide6", "slot_racing.uikit", "cv2", "gpiozero", "RPi"]

[[tool.importlinter.contracts]]
name = "HUD configuration is free of UI and the race engine"
type = "forbidden"
source_modules = ["slot_racing.modules.races.hud"]
forbidden_modules = [
    "PySide6",
    "slot_racing.uikit",
    "slot_racing.modules.races.engine",
    "slot_racing.modules.races.recorder",
    "slot_racing.modules.races.runner",
]

[[tool.importlinter.contracts]]
name = "Race UI does not contain race logic"
type = "forbidden"
source_modules = ["slot_racing.modules.races.ui"]
forbidden_modules = [
    "slot_racing.modules.races.engine",
    "slot_racing.modules.races.recorder",
    "cv2",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Timing providers do not know the UI"
type = "forbidden"
source_modules = [
    "slot_racing.modules.timing",
    "slot_racing.modules.timing_sensor",
]
forbidden_modules = ["PySide6", "slot_racing.uikit"]

[[tool.importlinter.contracts]]
name = "Camera timing logic does not know the UI"
type = "forbidden"
source_modules = [
    "slot_racing.modules.timing_camera._checks",
    "slot_racing.modules.timing_camera.camera_config",
    "slot_racing.modules.timing_camera.capture",
    "slot_racing.modules.timing_camera.configuration",
    "slot_racing.modules.timing_camera.detection",
    "slot_racing.modules.timing_camera.frame_source",
    "slot_racing.modules.timing_camera.frames",
    "slot_racing.modules.timing_camera.geometry",
    "slot_racing.modules.timing_camera.lease",
    "slot_racing.modules.timing_camera.opencv_device",
    "slot_racing.modules.timing_camera.preview",
    "slot_racing.modules.timing_camera.provider",
    "slot_racing.modules.timing_camera.store",
]
forbidden_modules = ["PySide6", "slot_racing.uikit"]

[[tool.importlinter.contracts]]
name = "Camera setup UI does not touch OpenCV or races"
type = "forbidden"
source_modules = ["slot_racing.modules.timing_camera.ui"]
forbidden_modules = [
    "cv2",
    "slot_racing.modules.timing_camera.opencv_device",
    "slot_racing.modules.races",
]

[[tool.importlinter.contracts]]
name = "Simulation and timing setup are free of hardware libraries"
type = "forbidden"
source_modules = ["slot_racing.modules.timing"]
forbidden_modules = ["cv2", "gpiozero", "RPi"]

[[tool.importlinter.contracts]]
name = "Core does not depend on the shared UI helpers"
type = "forbidden"
source_modules = ["slot_racing.core"]
forbidden_modules = ["slot_racing.uikit"]

[[tool.importlinter.contracts]]
name = "Shared UI helpers depend on the core only"
type = "forbidden"
source_modules = ["slot_racing.uikit"]
forbidden_modules = ["slot_racing.app", "slot_racing.modules"]

[[tool.importlinter.contracts]]
name = "Race engine knows only the core, not timing providers"
type = "forbidden"
source_modules = ["slot_racing.modules.races.engine"]
forbidden_modules = [
    "slot_racing.modules.timing",
    "slot_racing.modules.timing_camera",
    "slot_racing.modules.timing_sensor",
    "slot_racing.app",
    "slot_racing.uikit",
]

[[tool.importlinter.contracts]]
name = "Timing configuration logic is free of UI and hardware libraries"
type = "forbidden"
source_modules = [
    "slot_racing.modules.tracks.timing_editor",
    "slot_racing.modules.tracks.timing_test",
]
forbidden_modules = ["PySide6", "slot_racing.uikit", "cv2", "gpiozero", "RPi"]
