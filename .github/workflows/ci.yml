name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Import Linter
        run: uv run lint-imports

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Backstop if a worker ignores the per-test limit in tests/conftest.py.
    # Phase 2 finished in about three minutes; this must not approach an hour.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pytest
        timeout-minutes: 15
        # Four workers matches the 4-vCPU GitHub runners. Measured on Linux;
        # do not switch to -n auto, which follows the host CPU count.
        # Each test is limited to 120s (tests/conftest.py). On expiry the
        # worker prints the node id, dumps all thread stacks, and exits.
        run: uv run pytest -n 4
